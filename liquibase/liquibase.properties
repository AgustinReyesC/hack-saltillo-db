# Propiedades para correr Liquibase fuera de Docker (liquibase CLI local).
# Se asume que el comando se ejecuta desde la raíz del repositorio.
# Dentro de Docker, docker-compose.yml inyecta estas mismas variables.
#
#   liquibase --defaults-file=liquibase/liquibase.properties update
#
# Por defecto se aplican TODOS los changesets (esquema + datos de ejemplo). Para aplicar
# solo el esquema, agrega el flag:  --context-filter=base

changelog-file: liquibase/changelog/db.changelog-master.yaml
search-path: liquibase/changelog

url: jdbc:postgresql://localhost:5432/inventario
username: inventario
password: inventario

log-level: info
